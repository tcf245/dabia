comment:
  layout: "header, diff, changes, sunburst"
  behavior: default
  require_changes: false  # Always post a comment even if no changes in coverage

coverage:
  status:
    project:
      default:
        target: 80%      # PR will fail if total project coverage is below 80%
        threshold: 0%
    patch:
      default:
        target: auto
        informational: true
